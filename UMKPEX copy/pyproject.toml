[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "umkpex"
version = "0.1.0"
description = "Python wrapper for the UMKPEX maximum k-plex solver"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "UMKPEX authors" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Operating System :: OS Independent",
]

[project.scripts]
umkpex = "umkpex.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
